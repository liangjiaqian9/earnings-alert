name: Stock Monitor

on:
  schedule:
    - cron: '0 13 * * 1-5'      # 每天早上推送财报（美东9点）
    - cron: '*/30 13-21 * * 1-5' # 每30分钟检查新闻（美东9点-5点）
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: pip install requests

    - name: Run earnings check (每天早上9点)
      if: github.event.schedule == '0 13 * * 1-5'
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      run: python monitor.py earnings

    - name: Run news check (每30分钟)
      if: github.event.schedule == '*/30 13-21 * * 1-5'
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
      run: python monitor.py news
